<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NannyMatch SA - Redirecting</title>
    <script>
      // Automatically redirect GitHub Pages 404s back to root index.html
      const repoBase = window.location.pathname.split('/')[1] ? '/' + window.location.pathname.split('/')[1] + '/' : '/';
      window.location.replace(repoBase);
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #fafaf9; color: #1c1917;">
    <p>Loading NannyMatch SA...</p>
    <p><a href="./">Click here if not redirected automatically</a></p>
  </body>
</html>
